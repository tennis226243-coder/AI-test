<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>個人用AIエージェント（テスト版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root {
    --bg: #05070d;
    --bg-2: #090d1a;
    --panel: rgba(14, 20, 36, 0.68);
    --panel-solid: #0b0f1c;
    --border: rgba(120, 210, 255, 0.16);
    --border-strong: rgba(120, 210, 255, 0.4);
    --text: #dceeff;
    --text-dim: #7691ab;
    --accent: #55e2ff;
    --accent-soft: rgba(85, 226, 255, 0.14);
    --accent-contrast: #03131a;
    --amber: #ffb84d;
    --amber-soft: rgba(255, 184, 77, 0.14);
    --user-bubble: rgba(85, 226, 255, 0.08);
    --user-border: rgba(85, 226, 255, 0.32);
    --ai-bubble: rgba(255, 255, 255, 0.035);
    --ai-border: rgba(255, 255, 255, 0.10);
    --error: #ff5d72;
    --warning-bg: rgba(255, 184, 77, 0.10);
    --warning-text: #ffd39a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(ellipse 120% 60% at 50% -10%, #0d1830 0%, var(--bg) 55%), var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  body {
    background-image:
      radial-gradient(ellipse 120% 60% at 50% -10%, #0d1830 0%, var(--bg) 55%),
      repeating-linear-gradient(0deg, rgba(120,210,255,0.025) 0px, rgba(120,210,255,0.025) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(120,210,255,0.025) 0px, rgba(120,210,255,0.025) 1px, transparent 1px, transparent 42px);
  }
  .hud-label {
    font-family: "Rajdhani", "Inter", sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: rgba(6, 9, 18, 0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 5;
  }
  header h1 {
    font-family: "Rajdhani", sans-serif;
    font-weight: 600;
    letter-spacing: 0.04em;
    font-size: 16px;
    margin: 0;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
    text-shadow: 0 0 12px rgba(85, 226, 255, 0.35);
  }
  header button.icon {
    border: 1px solid var(--border);
    background: rgba(85, 226, 255, 0.05);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    font-size: 17px;
    color: var(--accent);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  header button.icon:active {
    box-shadow: 0 0 14px rgba(85, 226, 255, 0.55);
    border-color: var(--border-strong);
  }

  /* --- コア（パーティクルスフィア） --- */
  #core-wrap {
    position: sticky;
    top: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 0 10px;
    background: linear-gradient(180deg, rgba(6,9,18,0.92) 0%, rgba(6,9,18,0.78) 70%, rgba(6,9,18,0) 100%);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 18px 34px -14px rgba(0,0,0,0.65);
    flex-shrink: 0;
  }
  #core-sphere { display: block; }
  #core-caption {
    position: absolute;
    bottom: 8px;
    left: 0; right: 0;
    text-align: center;
    font-family: "Rajdhani", sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-shadow: 0 0 8px rgba(85, 226, 255, 0.6);
    opacity: 0.85;
    pointer-events: none;
  }

  #warning-banner {
    background: var(--warning-bg);
    color: var(--warning-text);
    font-size: 12px;
    padding: 8px 14px;
    line-height: 1.5;
    border-bottom: 1px solid rgba(255, 184, 77, 0.2);
  }
  #status-line {
    font-family: "Rajdhani", sans-serif;
    letter-spacing: 0.1em;
    font-size: 12px;
    color: var(--text-dim);
    padding: 5px 14px;
    background: rgba(6, 9, 18, 0.5);
    border-bottom: 1px solid var(--border);
  }
  #status-text { color: var(--accent); font-weight: 600; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble-row { display: flex; animation: rise-in 0.28s ease-out; }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .bubble-row.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%;
    padding: 10px 13px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .bubble .role {
    display: block;
    font-family: "Rajdhani", sans-serif;
    letter-spacing: 0.12em;
    font-size: 10.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .bubble.user {
    background: var(--user-bubble);
    border: 1px solid var(--user-border);
    border-bottom-right-radius: 3px;
    box-shadow: 0 0 18px rgba(85, 226, 255, 0.06);
  }
  .bubble.assistant {
    background: var(--ai-bubble);
    border: 1px solid var(--ai-border);
    border-bottom-left-radius: 3px;
  }
  #empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    padding: 24px;
  }
  #input-area {
    border-top: 1px solid var(--border);
    background: rgba(6, 9, 18, 0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  #input-row { display: flex; gap: 8px; align-items: flex-end; }
  #text-input {
    flex: 1;
    resize: none;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 15px;
    max-height: 110px;
    min-height: 40px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #text-input:focus {
    outline: none;
    border-color: var(--border-strong);
    box-shadow: 0 0 0 3px rgba(85, 226, 255, 0.12);
  }
  #text-input::placeholder { color: var(--text-dim); }
  #text-input:disabled { opacity: 0.4; }
  .round-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text);
    transition: box-shadow 0.2s, border-color 0.2s, background 0.2s;
  }
  #mic-btn { color: var(--accent); }
  #mic-btn.recording {
    background: var(--amber-soft);
    border-color: var(--amber);
    color: var(--amber);
    animation: mic-pulse 1.1s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 184, 77, 0.5); }
    50% { box-shadow: 0 0 0 9px rgba(255, 184, 77, 0); }
  }
  #send-btn {
    background: var(--accent-soft);
    border-color: var(--border-strong);
    color: var(--accent);
  }
  #send-btn:active:not(:disabled) { box-shadow: 0 0 16px rgba(85, 226, 255, 0.5); }
  #send-btn:disabled, #mic-btn:disabled { opacity: 0.35; }
  #cancel-btn {
    margin-top: 8px;
    width: 100%;
    background: rgba(255, 93, 114, 0.08);
    border: 1px solid rgba(255, 93, 114, 0.3);
    border-radius: 8px;
    padding: 6px;
    font-size: 13px;
    color: #ffb0ba;
  }

  /* --- サイドバー(会話一覧) オーバーレイ --- */
  #sidebar-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(2px);
    display: none;
    z-index: 20;
  }
  #sidebar-overlay.open { display: block; }
  #sidebar {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: 82%; max-width: 320px;
    background: var(--panel-solid);
    border-right: 1px solid var(--border);
    transform: translateX(-100%);
    transition: transform 0.2s ease;
    z-index: 21;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(85, 226, 255, 0.08); }
  #sidebar .sidebar-header { padding: 14px; border-bottom: 1px solid var(--border); }
  #new-conv-btn {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--accent-soft);
    color: var(--accent);
    font-family: "Rajdhani", sans-serif;
    letter-spacing: 0.06em;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #conv-list { flex: 1; overflow-y: auto; }
  .conv-item {
    display: flex; align-items: center; gap: 6px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
  }
  .conv-item.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .conv-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-item .del-btn { color: #ff8a96; background: none; border: none; font-size: 13px; padding: 4px; }
  #sidebar-settings-btn {
    margin: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 14px;
  }

  /* --- 設定モーダル --- */
  #settings-modal {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 30;
    display: none;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #settings-modal.open { display: flex; }
  #settings-modal header { justify-content: space-between; }
  #settings-modal header h1 { flex: unset; }
  #settings-body { flex: 1; overflow-y: auto; padding: 16px; }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-family: "Rajdhani", sans-serif;
    letter-spacing: 0.08em;
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .field input[type=text], .field input[type=password], .field textarea {
    width: 100%;
    padding: 10px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
  }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--border-strong);
    box-shadow: 0 0 0 3px rgba(85, 226, 255, 0.12);
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field .hint { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .test-btn {
    margin-top: 6px;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-strong);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px;
  }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  #save-settings-btn {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--accent-soft);
    color: var(--accent);
    font-family: "Rajdhani", sans-serif;
    letter-spacing: 0.08em;
    font-size: 16px;
    font-weight: 600;
    margin-top: 8px;
  }
  #speech-support-note { font-size: 12px; color: var(--text-dim); padding: 0 16px 16px; }

</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon" id="open-sidebar-btn" aria-label="会話一覧">☰</button>
    <h1 id="chat-title">会話を選択してください</h1>
    <button class="icon" id="open-settings-btn" aria-label="設定">⚙︎</button>
  </header>

  <div id="core-wrap">
    <canvas id="core-sphere" width="280" height="220"></canvas>
    <div id="core-caption" class="hud-label">STANDBY</div>
  </div>

  <div id="warning-banner">
    テスト版です。APIキーはこの端末のブラウザ内（localStorage）に保存されます。Keychain等の安全な保管ではないため、共有端末では使用しないでください。
  </div>

  <div id="status-line">状態: <span id="status-text">未設定</span></div>

  <div id="messages">
    <div id="empty-state">左上のメニューから「新しい会話」を開始してください。</div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="text-input" placeholder="メッセージを入力" rows="1" disabled></textarea>
      <button class="round-btn" id="mic-btn" disabled aria-label="録音">🎤</button>
      <button class="round-btn" id="send-btn" disabled aria-label="送信">➤</button>
    </div>
    <button id="cancel-btn" style="display:none;">キャンセル</button>
  </div>
</div>

<div id="sidebar-overlay"></div>
<div id="sidebar">
  <div class="sidebar-header">
    <button id="new-conv-btn">＋ 新しい会話</button>
  </div>
  <div id="conv-list"></div>
  <button id="sidebar-settings-btn">設定を開く</button>
</div>

<div id="settings-modal">
  <header>
    <h1>設定</h1>
    <button class="icon" id="close-settings-btn" aria-label="閉じる">✕</button>
  </header>
  <div id="settings-body">
    <div class="field">
      <label for="gemini-key-input">Gemini APIキー</label>
      <input type="password" id="gemini-key-input" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="hint" id="gemini-key-hint"></div>
      <button class="test-btn" id="test-gemini-btn">接続確認</button>
    </div>
    <div class="field">
      <label for="gemini-model-input">Geminiモデル名</label>
      <input type="text" id="gemini-model-input">
    </div>
    <div class="field">
      <label for="system-instruction-input">システム指示</label>
      <textarea id="system-instruction-input" placeholder="例: 回答は簡潔な日本語の敬語で。"></textarea>
    </div>
    <div class="field toggle-row">
      <label for="history-toggle" style="margin:0;">会話履歴をこの端末に保存する</label>
      <input type="checkbox" id="history-toggle">
    </div>
    <button id="save-settings-btn">保存</button>
  </div>
  <div id="speech-support-note"></div>
</div>

<script>
// ---------- コア: パーティクルスフィア（状態に応じて色・速度が変化するJARVIS風ビジュアル） ----------
(function () {
  "use strict";
  var canvas = document.getElementById("core-sphere");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var cssW = canvas.width, cssH = canvas.height;
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  ctx.scale(dpr, dpr);

  var cx = cssW / 2, cy = cssH / 2;
  var radius = Math.min(cssW, cssH) / 2 - 14;

  // フィボナッチ球面上に点を配置
  var COUNT = 260;
  var points = [];
  (function buildSphere() {
    var golden = Math.PI * (3 - Math.sqrt(5));
    for (var i = 0; i < COUNT; i++) {
      var y = 1 - (i / (COUNT - 1)) * 2;
      var r = Math.sqrt(1 - y * y);
      var theta = golden * i;
      points.push({ x: Math.cos(theta) * r, y: y, z: Math.sin(theta) * r });
    }
  })();

  // 状態ごとの見た目パラメータ
  var MOODS = {
    "未設定":       { color: [120, 140, 160], speed: 0.15, jitter: 0.0, pulse: 0.02, caption: "STANDBY" },
    "待機中":       { color: [85, 226, 255],  speed: 0.35, jitter: 0.01, pulse: 0.05, caption: "READY" },
    "録音中(音声認識)": { color: [255, 184, 77], speed: 0.9,  jitter: 0.05, pulse: 0.18, caption: "LISTENING" },
    "回答生成中":    { color: [140, 255, 235], speed: 1.6,  jitter: 0.03, pulse: 0.12, caption: "THINKING" },
    "出力中":       { color: [200, 255, 250], speed: 0.8,  jitter: 0.015, pulse: 0.07, caption: "SPEAKING" },
    "完了":         { color: [110, 240, 180], speed: 0.4,  jitter: 0.0, pulse: 0.06, caption: "ONLINE" },
    "エラー":       { color: [255, 93, 114],  speed: 0.6,  jitter: 0.06, pulse: 0.2, caption: "ERROR" }
  };
  var current = MOODS["未設定"];
  var target = MOODS["未設定"];
  var mix = { color: current.color.slice(), speed: current.speed, jitter: current.jitter, pulse: current.pulse };
  var burst = 0; // 出力の一文字ごとに加算され、球体を瞬間的に明るく/大きくする
  var captionEl = document.getElementById("core-caption");

  function setMood(statusLabel) {
    target = MOODS[statusLabel] || MOODS["未設定"];
    if (captionEl) captionEl.textContent = target.caption;
  }
  function pulse() {
    burst = Math.min(1, burst + 0.4);
  }
  window.__core = { setMood: setMood, pulse: pulse };

  var angleY = 0, angleX = 0.4, t = 0;

  function lerp(a, b, k) { return a + (b - a) * k; }

  function frame() {
    t += 0.016;
    // 目標ムードへ滑らかに近づける
    mix.speed = lerp(mix.speed, target.speed, 0.04);
    mix.jitter = lerp(mix.jitter, target.jitter, 0.04);
    mix.pulse = lerp(mix.pulse, target.pulse, 0.04);
    for (var c = 0; c < 3; c++) mix.color[c] = lerp(mix.color[c], target.color[c], 0.04);
    burst *= 0.86; // 出力パルスの減衰

    angleY += 0.006 * mix.speed * 10 * 0.1 + 0.003;
    angleX = 0.4 + Math.sin(t * 0.3) * 0.08;

    ctx.clearRect(0, 0, cssW, cssH);

    var col = mix.color.map(function (v) { return Math.min(255, Math.round(v + burst * 45)); });
    var breathe = 1 + Math.sin(t * 2.2) * mix.pulse + burst * 0.10;

    // 中心グロー
    var glowR = radius * 1.15 * breathe;
    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    grad.addColorStop(0, "rgba(" + col.join(",") + "," + (0.20 + burst * 0.18) + ")");
    grad.addColorStop(1, "rgba(" + col.join(",") + ",0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
    ctx.fill();

    // HUDリング（回転する破線の輪）
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = "rgba(" + col.join(",") + "," + (0.35 + burst * 0.25) + ")";
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 10]);
    ctx.lineDashOffset = -t * 26;
    ctx.beginPath();
    ctx.ellipse(0, 0, radius * 1.34, radius * 0.42, 0.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([1, 7]);
    ctx.lineDashOffset = t * 34;
    ctx.strokeStyle = "rgba(" + col.join(",") + "," + (0.22 + burst * 0.2) + ")";
    ctx.beginPath();
    ctx.ellipse(0, 0, radius * 1.22, radius * 0.34, -0.6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    var cosY = Math.cos(angleY), sinY = Math.sin(angleY);
    var cosX = Math.cos(angleX), sinX = Math.sin(angleX);

    var projected = [];
    for (var i = 0; i < points.length; i++) {
      var p = points[i];
      var jitter = mix.jitter * Math.sin(t * 3 + i) + burst * 0.03 * Math.sin(i * 12.9);
      var px = p.x * (1 + jitter), py = p.y * (1 + jitter), pz = p.z * (1 + jitter);

      // Y軸回転
      var x1 = px * cosY - pz * sinY;
      var z1 = px * sinY + pz * cosY;
      // X軸回転
      var y2 = py * cosX - z1 * sinX;
      var z2 = py * sinX + z1 * cosX;

      var scale = breathe * radius;
      var perspective = 1 / (2 - z2);
      var sx = cx + x1 * scale * perspective;
      var sy = cy + y2 * scale * perspective;
      var depthAlpha = (z2 + 1) / 2;
      projected.push({ x: sx, y: sy, a: 0.15 + depthAlpha * 0.85, r: 0.6 + depthAlpha * 1.6 + burst * 0.8 });
    }

    for (var j = 0; j < projected.length; j++) {
      var q = projected[j];
      ctx.beginPath();
      ctx.fillStyle = "rgba(" + col.join(",") + "," + q.a.toFixed(2) + ")";
      ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

(function () {
  "use strict";

  // ---------- ストレージ ----------
  var STORAGE_SETTINGS = "paia_settings";
  var STORAGE_GEMINI_KEY = "paia_gemini_key";
  var STORAGE_CONVERSATIONS = "paia_conversations";

  var defaultSettings = {
    geminiModel: "gemini-2.5-flash",
    systemInstruction: "",
    historyEnabled: true
  };

  function loadSettings() {
    try {
      var raw = localStorage.getItem(STORAGE_SETTINGS);
      if (!raw) return Object.assign({}, defaultSettings);
      var parsed = JSON.parse(raw);
      return Object.assign({}, defaultSettings, parsed);
    } catch (e) {
      return Object.assign({}, defaultSettings);
    }
  }
  function saveSettings(s) {
    localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(s));
  }
  function getGeminiKey() { return localStorage.getItem(STORAGE_GEMINI_KEY) || ""; }
  function setGeminiKey(v) { localStorage.setItem(STORAGE_GEMINI_KEY, v); }
  function maskKey(v) {
    if (!v) return "";
    if (v.length <= 4) return "*".repeat(v.length);
    return "*".repeat(v.length - 4) + v.slice(-4);
  }

  function loadConversations() {
    try {
      var raw = localStorage.getItem(STORAGE_CONVERSATIONS);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function persistConversations(list) {
    localStorage.setItem(STORAGE_CONVERSATIONS, JSON.stringify(list));
  }

  // ---------- 状態 ----------
  var settings = loadSettings();
  var persistedConversations = loadConversations(); // 履歴保存オンで保存された会話
  var sessionConversations = [];                    // 履歴保存オフ中に作成した、DBに保存しない会話（再読み込みで消える）
  var currentConversationId = null;
  var currentTask = null;      // {cancelled: bool}
  var recognizing = false;
  var recognition = null;

  var STATUS = {
    UNSET: "未設定", IDLE: "待機中", RECORDING: "録音中(音声認識)",
    GENERATING: "回答生成中", SPEAKING: "出力中", DONE: "完了", ERROR: "エラー"
  };

  // ---------- DOM参照 ----------
  var el = {
    title: document.getElementById("chat-title"),
    statusText: document.getElementById("status-text"),
    messages: document.getElementById("messages"),
    emptyState: document.getElementById("empty-state"),
    input: document.getElementById("text-input"),
    micBtn: document.getElementById("mic-btn"),
    sendBtn: document.getElementById("send-btn"),
    cancelBtn: document.getElementById("cancel-btn"),
    openSidebarBtn: document.getElementById("open-sidebar-btn"),
    sidebar: document.getElementById("sidebar"),
    sidebarOverlay: document.getElementById("sidebar-overlay"),
    newConvBtn: document.getElementById("new-conv-btn"),
    convList: document.getElementById("conv-list"),
    sidebarSettingsBtn: document.getElementById("sidebar-settings-btn"),
    openSettingsBtn: document.getElementById("open-settings-btn"),
    settingsModal: document.getElementById("settings-modal"),
    closeSettingsBtn: document.getElementById("close-settings-btn"),
    geminiKeyInput: document.getElementById("gemini-key-input"),
    geminiKeyHint: document.getElementById("gemini-key-hint"),
    testGeminiBtn: document.getElementById("test-gemini-btn"),
    geminiModelInput: document.getElementById("gemini-model-input"),
    systemInstructionInput: document.getElementById("system-instruction-input"),
    historyToggle: document.getElementById("history-toggle"),
    saveSettingsBtn: document.getElementById("save-settings-btn"),
    speechNote: document.getElementById("speech-support-note")
  };

  // ---------- ヘルパー ----------
  function findConversation(id) {
    return persistedConversations.find(function (c) { return c.id === id; }) ||
           sessionConversations.find(function (c) { return c.id === id; });
  }
  function isPersisted(conv) {
    return persistedConversations.indexOf(conv) !== -1;
  }
  function makeTitle(text) {
    var single = text.replace(/\s+/g, " ").trim();
    if (!single) return null;
    return single.length > 30 ? single.slice(0, 30) + "…" : single;
  }
  function sortedAllConversations() {
    return persistedConversations.concat(sessionConversations)
      .slice()
      .sort(function (a, b) { return b.updatedAt - a.updatedAt; });
  }

  function setStatus(s) {
    el.statusText.textContent = s;
    var busy = (s === STATUS.RECORDING || s === STATUS.GENERATING || s === STATUS.SPEAKING);
    el.cancelBtn.style.display = busy ? "block" : "none";
    updateInputEnabled();
    if (window.__core && window.__core.setMood) window.__core.setMood(s);
  }
  function updateStatusForKeyState() {
    var current = el.statusText.textContent;
    if (current === STATUS.RECORDING || current === STATUS.GENERATING || current === STATUS.SPEAKING) return;
    setStatus(getGeminiKey() ? STATUS.IDLE : STATUS.UNSET);
  }

  function updateInputEnabled() {
    var hasConv = currentConversationId !== null;
    var busy = (el.statusText.textContent === STATUS.RECORDING || el.statusText.textContent === STATUS.GENERATING || el.statusText.textContent === STATUS.SPEAKING);
    el.input.disabled = !hasConv;
    el.sendBtn.disabled = !hasConv || busy || el.input.value.trim() === "";
    el.micBtn.disabled = !hasConv || busy || !recognition;
  }

  // ---------- 描画 ----------
  function renderSidebar() {
    el.convList.innerHTML = "";
    var all = sortedAllConversations();
    all.forEach(function (c) {
      var row = document.createElement("div");
      row.className = "conv-item" + (c.id === currentConversationId ? " active" : "");
      var titleSpan = document.createElement("span");
      titleSpan.className = "title";
      titleSpan.textContent = c.title + (isPersisted(c) ? "" : "（未保存）");
      row.appendChild(titleSpan);
      var delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.textContent = "削除";
      delBtn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        deleteConversation(c.id);
      });
      row.appendChild(delBtn);
      row.addEventListener("click", function () { selectConversation(c.id); closeSidebar(); });
      el.convList.appendChild(row);
    });
  }

  var pendingRevealMessage = null; // タイプライター表示中のメッセージ（参照一致で判定）

  function renderMessages() {
    var conv = findConversation(currentConversationId);
    el.messages.innerHTML = "";
    if (!conv || conv.messages.length === 0) {
      var empty = document.createElement("div");
      empty.id = "empty-state";
      empty.textContent = conv ? "メッセージを送ってみましょう。" : "左上のメニューから「新しい会話」を開始してください。";
      el.messages.appendChild(empty);
      return;
    }
    var revealTargetEl = null;
    conv.messages.forEach(function (m) {
      var row = document.createElement("div");
      row.className = "bubble-row " + m.role;
      var bubble = document.createElement("div");
      bubble.className = "bubble " + m.role;
      var roleLabel = document.createElement("span");
      roleLabel.className = "role";
      roleLabel.textContent = m.role === "user" ? "あなた" : "AI";
      bubble.appendChild(roleLabel);
      var body = document.createElement("span");
      var isRevealTarget = (m === pendingRevealMessage);
      body.textContent = isRevealTarget ? "" : m.content;
      bubble.appendChild(body);
      row.appendChild(bubble);
      el.messages.appendChild(row);
      if (isRevealTarget) revealTargetEl = body;
    });
    el.messages.scrollTop = el.messages.scrollHeight;
    if (revealTargetEl) startReveal(pendingRevealMessage.content, revealTargetEl);
  }

  function startReveal(text, targetEl) {
    var i = 0;
    var total = text.length;
    // 長文でも読み終わりが長くなりすぎないよう、文字数に応じて速度を調整する
    var totalDuration = Math.min(3800, Math.max(500, total * 16));
    var perCharMs = Math.max(6, totalDuration / Math.max(total, 1));
    var charsPerTick = perCharMs < 10 ? Math.ceil(10 / perCharMs) : 1;
    setStatus(STATUS.SPEAKING);

    function step() {
      if (revealSkip) {
        targetEl.textContent = text;
        pendingRevealMessage = null;
        revealSkip = false;
        setStatus(STATUS.DONE);
        return;
      }
      i += charsPerTick;
      targetEl.textContent = text.slice(0, i);
      el.messages.scrollTop = el.messages.scrollHeight;
      if (window.__core && window.__core.pulse) window.__core.pulse();
      if (i < total) {
        setTimeout(step, perCharMs);
      } else {
        targetEl.textContent = text;
        pendingRevealMessage = null;
        setStatus(STATUS.DONE);
      }
    }
    step();
  }

  function renderHeader() {
    var conv = findConversation(currentConversationId);
    el.title.textContent = conv ? conv.title : "会話を選択してください";
  }

  function refreshAll() {
    renderSidebar();
    renderMessages();
    renderHeader();
    updateInputEnabled();
  }

  // ---------- 会話操作 ----------
  function createConversation() {
    var now = Date.now();
    var conv = { id: "c" + now + "_" + Math.random().toString(36).slice(2, 7),
                 title: "新しい会話", createdAt: now, updatedAt: now, messages: [] };
    if (settings.historyEnabled) {
      persistedConversations.unshift(conv);
      persistConversations(persistedConversations);
    } else {
      conv.title = "新しい会話（未保存）";
      sessionConversations.unshift(conv);
    }
    currentConversationId = conv.id;
    updateStatusForKeyState();
    refreshAll();
  }

  function selectConversation(id) {
    currentConversationId = id;
    updateStatusForKeyState();
    refreshAll();
  }

  function deleteConversation(id) {
    if (!confirm("この会話と発言をすべて削除します。よろしいですか？")) return;
    var pIdx = persistedConversations.findIndex(function (c) { return c.id === id; });
    if (pIdx !== -1) {
      persistedConversations.splice(pIdx, 1);
      persistConversations(persistedConversations);
    } else {
      var sIdx = sessionConversations.findIndex(function (c) { return c.id === id; });
      if (sIdx !== -1) sessionConversations.splice(sIdx, 1);
    }
    if (currentConversationId === id) currentConversationId = null;
    refreshAll();
  }

  function touchConversation(conv) {
    conv.updatedAt = Date.now();
    if (isPersisted(conv)) persistConversations(persistedConversations);
  }

  // ---------- Gemini API ----------
  function trimHistory(turns, max) {
    max = max || 40;
    if (turns.length <= max) return turns;
    return turns.slice(turns.length - max);
  }

  function callGemini(apiKey, model, turns, systemInstruction) {
    // Gemini は role "user" / "model"、本文は parts[].text という形式。
    var contents = turns.map(function (t) {
      return { role: t.role === "assistant" ? "model" : "user", parts: [{ text: t.content }] };
    });
    var body = { contents: contents, generationConfig: { maxOutputTokens: 4096 } };
    if (systemInstruction) {
      body.systemInstruction = { parts: [{ text: systemInstruction }] };
    }
    var url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent";
    return fetch(url, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-goog-api-key": apiKey
      },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().then(function (data) {
        if (res.ok) {
          var candidate = (data.candidates || [])[0];
          var parts = (candidate && candidate.content && candidate.content.parts) || [];
          var text = parts.map(function (p) { return p.text || ""; }).join("").trim();
          if (!text && candidate && candidate.finishReason && candidate.finishReason !== "STOP") {
            throw new Error("回答を生成できませんでした（理由: " + candidate.finishReason + "）。");
          }
          return text;
        }
        var status = (data.error && data.error.status) || "";
        var err;
        if (res.status === 400 && status === "INVALID_ARGUMENT") {
          err = "Gemini APIキーが正しくありません。設定を確認してください。";
        } else if (res.status === 401 || res.status === 403) {
          err = "Gemini APIキーが正しくありません。設定を確認してください。";
        } else if (res.status === 429) {
          err = "利用上限に達しています。しばらく時間をおいて再試行してください。";
        } else if (res.status >= 500) {
          err = "Gemini側で一時的なエラーが発生しました。時間をおいて再試行してください。";
        } else {
          err = "Gemini APIエラー（コード: " + res.status + "）";
        }
        throw new Error(err);
      });
    }, function () {
      throw new Error("ネットワークに接続できませんでした。接続を確認してください。");
    });
  }

  function sendMessage() {
    var text = el.input.value.trim();
    if (!text) return;
    var apiKey = getGeminiKey();
    if (!apiKey) {
      setStatus(STATUS.ERROR);
      alert("Gemini APIキーが未設定です。設定画面で登録してください。");
      openSettings();
      return;
    }
    var conv = findConversation(currentConversationId);
    if (!conv) return;

    var wasEmpty = conv.messages.length === 0;
    conv.messages.push({ role: "user", content: text, createdAt: Date.now() });
    if (wasEmpty) conv.title = makeTitle(text) || conv.title;
    touchConversation(conv);

    el.input.value = "";
    autoGrowInput();
    setStatus(STATUS.GENERATING);
    refreshAll();

    var turns = trimHistory(conv.messages.map(function (m) { return { role: m.role, content: m.content }; }));
    var task = { cancelled: false };
    currentTask = task;

    callGemini(apiKey, settings.geminiModel, turns, settings.systemInstruction).then(function (reply) {
      if (task.cancelled) return;
      var assistantMsg = { role: "assistant", content: reply, createdAt: Date.now() };
      conv.messages.push(assistantMsg);
      touchConversation(conv);
      pendingRevealMessage = assistantMsg;
      refreshAll(); // renderMessages() 内でタイプライター表示と球体のパルスが開始される
    }).catch(function (err) {
      if (task.cancelled) return;
      // 入力文は既にユーザー発言として保存・表示済みのため失われない。
      setStatus(STATUS.ERROR);
      alert(err.message || "予期しないエラーが発生しました。");
      refreshAll();
    });
  }

  var revealSkip = false;

  function cancelCurrent() {
    if (currentTask) currentTask.cancelled = true;
    if (recognizing && recognition) recognition.stop();
    if (pendingRevealMessage) revealSkip = true; // 出力中なら即座に全文表示して終える
    updateStatusForKeyState();
  }

  // ---------- 音声入力 (Web Speech API / Safari標準・動作保証なし) ----------
  function setupSpeechRecognition() {
    var Impl = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Impl) {
      el.speechNote.textContent = "この端末のSafariは音声認識(Web Speech API)に対応していないようです。テキスト入力をご利用ください。";
      el.micBtn.style.display = "none";
      return;
    }
    el.speechNote.textContent = "音声入力はSafari標準のWeb Speech APIを使用します（Apple/Google非公式・動作保証なし）。";
    recognition = new Impl();
    recognition.lang = "ja-JP";
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onresult = function (event) {
      var text = "";
      for (var i = 0; i < event.results.length; i++) text += event.results[i][0].transcript;
      el.input.value = text;
      autoGrowInput();
    };
    recognition.onerror = function () {
      recognizing = false;
      el.micBtn.classList.remove("recording");
      updateStatusForKeyState();
      alert("音声認識でエラーが発生しました。マイクの許可設定を確認するか、テキストで入力してください。");
    };
    recognition.onend = function () {
      recognizing = false;
      el.micBtn.classList.remove("recording");
      if (el.statusText.textContent === STATUS.RECORDING) updateStatusForKeyState();
      updateInputEnabled();
    };
  }

  function toggleRecording() {
    if (!recognition) return;
    if (recognizing) {
      recognition.stop();
      return;
    }
    try {
      recognition.start();
      recognizing = true;
      el.micBtn.classList.add("recording");
      setStatus(STATUS.RECORDING);
    } catch (e) {
      alert("マイクを開始できませんでした。");
    }
  }

  // ---------- 設定画面 ----------
  function openSettings() {
    el.geminiKeyInput.value = "";
    var existing = getGeminiKey();
    el.geminiKeyHint.textContent = existing ? "設定済み（" + maskKey(existing) + "）" : "未設定";
    el.geminiModelInput.value = settings.geminiModel;
    el.systemInstructionInput.value = settings.systemInstruction;
    el.historyToggle.checked = settings.historyEnabled;
    el.settingsModal.classList.add("open");
  }
  function closeSettings() { el.settingsModal.classList.remove("open"); }

  function testGeminiConnection() {
    var key = el.geminiKeyInput.value.trim() || getGeminiKey();
    if (!key) { alert("Gemini APIキーを入力してください。"); return; }
    var model = el.geminiModelInput.value.trim() || settings.geminiModel;
    el.testGeminiBtn.disabled = true;
    callGemini(key, model, [{ role: "user", content: "ping" }], null).then(function () {
      alert("Gemini APIに接続できました。");
    }).catch(function (err) {
      alert(err.message || "接続に失敗しました。");
    }).finally(function () { el.testGeminiBtn.disabled = false; });
  }

  function saveSettingsFromForm() {
    var typedKey = el.geminiKeyInput.value.trim();
    if (typedKey) setGeminiKey(typedKey);
    settings.geminiModel = el.geminiModelInput.value.trim() || defaultSettings.geminiModel;
    settings.systemInstruction = el.systemInstructionInput.value;
    settings.historyEnabled = el.historyToggle.checked;
    saveSettings(settings);
    closeSettings();
    updateStatusForKeyState();
    refreshAll();
  }

  // ---------- サイドバー開閉 ----------
  function openSidebar() {
    el.sidebar.classList.add("open");
    el.sidebarOverlay.classList.add("open");
  }
  function closeSidebar() {
    el.sidebar.classList.remove("open");
    el.sidebarOverlay.classList.remove("open");
  }

  function autoGrowInput() {
    el.input.style.height = "auto";
    el.input.style.height = Math.min(el.input.scrollHeight, 110) + "px";
    updateInputEnabled();
  }

  // ---------- イベント登録 ----------
  el.openSidebarBtn.addEventListener("click", openSidebar);
  el.sidebarOverlay.addEventListener("click", closeSidebar);
  el.newConvBtn.addEventListener("click", function () { createConversation(); closeSidebar(); });
  el.sidebarSettingsBtn.addEventListener("click", function () { openSettings(); closeSidebar(); });
  el.openSettingsBtn.addEventListener("click", openSettings);
  el.closeSettingsBtn.addEventListener("click", closeSettings);
  el.testGeminiBtn.addEventListener("click", testGeminiConnection);
  el.saveSettingsBtn.addEventListener("click", saveSettingsFromForm);
  el.sendBtn.addEventListener("click", sendMessage);
  el.cancelBtn.addEventListener("click", cancelCurrent);
  el.micBtn.addEventListener("click", toggleRecording);
  el.input.addEventListener("input", autoGrowInput);

  // ---------- 初期化 ----------
  setupSpeechRecognition();
  updateStatusForKeyState();
  refreshAll();
  if (!getGeminiKey()) {
    setTimeout(function () {
      alert("利用を開始するには、Gemini APIキーの登録が必要です。設定画面で登録してください。");
      openSettings();
    }, 200);
  }
})();
</script>
</body>
